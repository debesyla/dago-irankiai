name: Deploy

# Push to main -> verify every tool -> assemble one _deploy/ tree -> rsync it
# over a single SSH connection into the Hostinger /irankiai/ directory ->
# smoke-test every live tool.
#
# Host, port, user, key and target path come from the `production`
# environment secrets, so nothing about the server is recorded here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-irankiai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dago.lt/irankiai/
    permissions:
      contents: read
    env:
      MARKER: .deploy-marker-irankiai
      SITE: https://dago.lt/irankiai

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        # lint + tests of every tool, then assemble _deploy/ and validate it.
        run: npm run verify

      - name: Show artifact
        run: |
          echo "BUILD=$(cat _deploy/BUILD)"
          find _deploy -type f | sort

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          set -euo pipefail

          # Check the variables, not the files they land in: an empty secret
          # would otherwise surface two steps later as an opaque host-key
          # rejection that the marker guard misreports as a missing marker.
          for variable in DEPLOY_SSH_KEY SSH_HOST SSH_USER SSH_PORT \
                          SSH_KNOWN_HOSTS REMOTE_DIR; do
            value="${!variable:-}"
            test -n "$value" \
              || { echo "::error::$variable secret is empty or unset"; exit 1; }
          done

          # The whole /irankiai/ tree is mirrored with --delete, so the target
          # must be exactly that directory and nothing above it.
          case "$REMOTE_DIR" in
            */irankiai) ;;
            *) echo "::error::REMOTE_DIR must end in /irankiai; refusing to deploy"; exit 1 ;;
          esac

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Host keys are pinned from a secret rather than ssh-keyscan'd at
          # runtime; keyscanning would be trust-on-first-use on every run. If
          # the host is ever migrated this step starts failing, and that is
          # correct: re-verify the fingerprint and update the secret.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      # Refuses to run --delete against anything but the directory that was
      # marked by hand. This is the guard against a target-path typo wiping a
      # sibling directory.
      - name: Guard target directory
        env:
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          set -uo pipefail

          # `test -f` exits 0 or 1; 255 is ssh itself failing to get a session.
          # 2>&1 >/dev/null captures stderr only, in that order.
          if error="$(ssh deploy-target "test -f '$REMOTE_DIR/$MARKER'" 2>&1 >/dev/null)"; then
            status=0
          else
            status=$?
          fi

          case "$status" in
            0)
              echo "Marker present - target confirmed." ;;
            1)
              echo "::error::$MARKER is absent in the target directory; refusing to deploy"
              echo "::error::the host answered, so this really is a missing file: create the empty marker by hand in the /irankiai/ directory."
              exit 1 ;;
            255)
              echo "::error::SSH could not reach the host: ${error:-no stderr output}"
              echo "::error::NOT a missing marker - nothing was checked. Verify SSH_HOST/SSH_PORT, sshd, and that the runner is not firewalled."
              exit 1 ;;
            *)
              echo "::error::Marker check exited $status: ${error:-no stderr output}"
              exit 1 ;;
          esac

      - name: Dry run
        env:
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          rsync -a --checksum --delete --itemize-changes --dry-run \
            --exclude "$MARKER" \
            --exclude '.well-known/' \
            -e "ssh -F $HOME/.ssh/config" \
            _deploy/ "deploy-target:$REMOTE_DIR/"

      - name: Deploy
        env:
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          # --checksum is required: actions/checkout stamps every file's mtime
          # with checkout time, so without it rsync re-transfers everything.
          rsync -a --checksum --delete --itemize-changes \
            --exclude "$MARKER" \
            --exclude '.well-known/' \
            -e "ssh -F $HOME/.ssh/config" \
            _deploy/ "deploy-target:$REMOTE_DIR/"

      - name: Smoke test
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          # Ask the origin, not Cloudflare. The dago.lt zone is proxied by
          # Cloudflare since 2026-09-23, and it answers every request from
          # GitHub's runner IPs with a challenge (403, cf-mitigated:
          # challenge). The SSH host is the Hostinger server that serves this
          # site, so pin the site's name to it for this job: curl and Node
          # both read /etc/hosts, and TLS is still verified against the name.
          server_ip="$(getent ahostsv4 "$SSH_HOST" | awk 'NR == 1 { print $1 }')"
          test -n "$server_ip" || { echo "::error::cannot resolve SSH_HOST"; exit 1; }
          host="${SITE#https://}"; host="${host%%/*}"
          echo "$server_ip $host" | sudo tee -a /etc/hosts >/dev/null

          sleep 2
          node scripts/smoke.mjs
