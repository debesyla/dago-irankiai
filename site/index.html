    <title>Įrankiai // dago</title>
    <style>
        .skip-link {
            background: hsl(var(--theme));
            color: hsl(var(--black));
            left: 1rem;
            padding: 0.55rem 0.75rem;
            position: absolute;
            top: 1rem;
            transform: translateY(-200%);
            z-index: 10;
        }

        .skip-link:focus {
            transform: translateY(0);
        }

        .tool-page {
            width: min(100%, 75ch);
        }

        .site-header {
            margin-bottom: 2rem;
        }

        .site-header h1 {
            margin-bottom: 1rem;
        }

        .site-header p {
            margin-top: 0.5rem;
        }

        .dago-link {
            opacity: 0.2;
            text-decoration: none;
            white-space: nowrap;
        }

        .dago-link:hover,
        .dago-link:focus-visible {
            opacity: 1;
        }

        .tool-list {
            display: grid;
            gap: 1.5rem;
        }

        .tool-list li + li {
            margin-top: 0;
        }

        .tool-list p {
            margin-top: 0.25rem;
        }

        .site-footer {
            margin-top: 3rem;
        }

        .contact-section {
            border-top: 1px solid hsl(var(--theme) / 0.35);
            margin-top: 3rem;
            padding-top: 1.5rem;
        }

        .contact-section p + p {
            margin-top: 0.75rem;
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#main-content">Pereiti prie turinio</a>

    <main class="tool-page" id="main-content">
        <header class="site-header">
            <h1>
                įrankiai
                <a class="dago-link print-a-no-link" href="https://dago.lt">// dago</a>
            </h1>
            <p>Nemokami įrankiai, veikiantys tiesiai naršyklėje.</p>
        </header>

        <!-- TOOLS -->

        <footer class="contact-section">
            <p>
                Visi įrankiai yra atvirojo kodo (GPL-2.0-or-later):
                <a href="https://github.com/debesyla/dago-irankiai">github.com/debesyla/dago-irankiai</a>.
            </p>
            <p>Trūksta įrankio ar radote klaidą? <strong>labas (sraigė) dago.lt</strong></p>
            <div class="site-footer">
                <a href="https://weblog.dago.lt/mano-ai-di-politika" target="_blank" rel="noopener" class="print-a-no-link">
                    <img src="https://dago.lt/assets/img/byai.png"
                        srcset="https://dago.lt/assets/img/byai.png 1x, https://dago.lt/assets/img/byai@2x.png 2x"
                        alt="Sukūrė DI, ne žmogus" width="132" height="43" loading="lazy">
                </a>
            </div>
        </footer>
    </main>
</body>

</html>
